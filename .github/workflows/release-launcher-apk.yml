name: Build and publish launcher APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: launcher-apk-release
  cancel-in-progress: false

jobs:
  build-and-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Restore stable signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::GitHub Actions secret ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/launcher-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Test, lint, and build the launcher
        working-directory: launcher
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]]; then
            echo "::error::GitHub Actions secret ANDROID_KEYSTORE_PASSWORD is missing."
            exit 1
          fi
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease -PstableSigning=true -PsplitApks=true

      - name: Verify stable APK signature
        run: |
          set -euo pipefail
          release_dir=launcher/app/build/outputs/apk/release
          expected=("app-arm64-v8a-release.apk" "app-armeabi-v7a-release.apk")
          actual_count=$(find "$release_dir" -maxdepth 1 -type f -name '*.apk' | wc -l)
          if [[ "$actual_count" -ne "${#expected[@]}" ]]; then
            echo "::error::Expected exactly ${#expected[@]} ABI APKs, found $actual_count"
            exit 1
          fi
          for name in "${expected[@]}"; do
            apk="$release_dir/$name"
            if [[ ! -f "$apk" ]]; then
              echo "::error::Expected split APK was not produced: $apk"
              exit 1
            fi
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$apk"
          done

      - name: Remove temporary signing key
        if: always()
        run: |
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            rm -f -- "$ANDROID_KEYSTORE_PATH"
          fi

      - name: Prepare APK and release details
        id: release
        run: |
          python3 - <<'PY'
          import os
          import re
          import shutil
          from pathlib import Path

          gradle_file = Path("launcher/app/build.gradle").read_text(encoding="utf-8")
          version_name = re.search(r"versionName\s+['\"]([^'\"]+)['\"]", gradle_file)
          version_code = re.search(r"versionCode\s+(\d+)", gradle_file)
          if not version_name or not version_code:
              raise SystemExit("Could not read the launcher version from app/build.gradle")

          version_name = version_name.group(1)
          version_code = version_code.group(1)
          tag = f"launcher-v{version_name}-build{version_code}-stable"
          title = f"Android TV Home Launcher {version_name} (build {version_code}, ARM64 and ARMv7)"
          release_dir = Path("launcher/app/build/outputs/apk/release")
          sources = {
              "app-arm64-v8a-release.apk": "arm64-v8a",
              "app-armeabi-v7a-release.apk": "armeabi-v7a",
          }
          actual_sources = {path.name for path in release_dir.glob("*.apk")}
          if actual_sources != set(sources):
              raise SystemExit(f"Expected exactly {sorted(sources)}, found {sorted(actual_sources)}")
          total_size = 0
          built_apks = []
          for source_name, abi in sources.items():
              source = release_dir / source_name
              if not source.is_file():
                  raise SystemExit(f"Expected split APK was not produced: {source}")
              size = source.stat().st_size
              if size >= 134217728:
                  raise SystemExit(f"APK exceeds the 128 MiB embedded IPTV budget: {source_name} ({size} bytes)")
              total_size += size
              built_apks.append((source, abi, size))

          output = Path("dist")
          output.mkdir(exist_ok=True)
          for source, abi, size in built_apks:
              apk = output / f"tvhome-{version_name}-build{version_code}-{abi}-stable-signed.apk"
              shutil.copy2(source, apk)
              print(f"Prepared {apk} ({size} bytes)")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"tag={tag}\n")
              out.write(f"title={title}\n")
          print(f"Prepared {len(built_apks)} signed APKs ({total_size} bytes combined)")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          APK_DIR: dist
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; bump versionCode before publishing another APK set."
            exit 1
          fi

          gh release create "$RELEASE_TAG" "$APK_DIR"/*.apk \
            --title "$RELEASE_TITLE" \
            --latest \
            --notes "Built from commit ${GITHUB_SHA}. Both APKs are signed with the stable launcher release key.

          This release includes a 64-bit ARM (arm64-v8a) APK and a 32-bit ARM (armeabi-v7a) APK. Download only the file that matches your TV's architecture.

          To move from the earlier debug-signed APK, uninstall that build once before installing one of these. Future stable builds can update in place when versionCode increases."
